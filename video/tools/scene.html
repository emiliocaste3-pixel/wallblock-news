<style>

#foot{position:absolute;left:56px;right:56px;top:1660px;font:600 25px/1.4 "Inter";color:#a6b4bd;text-align:center;z-index:12}
#flash{position:absolute;inset:0;background:#fff;opacity:0;z-index:30;pointer-events:none}

<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eob=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const $=id=>document.getElementById(id);
let CFG=null;
function setBG(c1,c2){ $('bg').style.background=`radial-gradient(ellipse at 50% 28%,${c1} 0%,${c2} 70%)` }
const BG={hook:['#4a0f14','#0a1014'],intro:['#12304a','#0a1014'],crypto:['#3d1115','#0a1014'],ws:['#0f3a2a','#0a1014'],asia:['#2e2a12','#0a1014'],oil:['#3b2a12','#0a1014'],fed:['#3a2f0e','#0a1014'],out:['#12304a','#0a1014']};
function init(cfg){
  CFG=cfg; const T=cfg.T;
  $('date').textContent=T.date; $('h-pilltx').textContent=T.pill; $('h-btc').textContent=T.btc1; $('h-dn').textContent=T.btc2; $('h-pricetx').textContent=T.price;
  $('h-c1').textContent=T.chip1; $('h-liqtx').textContent=T.chip2; $('h-q').textContent=T.q;
  if(cfg.lang==='en'){ // the English question wrapped to 3 lines and hit the candles: slightly smaller, wider box = 2 lines
    $('h-q').style.fontSize='66px'; $('h-q').style.width='620px'; }
  $('i-title').innerHTML=T.introTitle; $('i-sub').textContent=T.introSub;
  $('c-title').textContent=T.cTitle; $('c-liqt').textContent=T.cLiq; $('c-lt').textContent=T.cLong; $('c-st').textContent=T.cShort; $('c-etft').textContent=T.cEtf; $('c-etfx').textContent=T.cEtfx;
  const etf=$('c-etf'); for(let i=0;i<5;i++){const d=document.createElement('div');d.style.cssText='width:150px;height:76px;border-radius:18px;background:var(--down);display:flex;align-items:center;justify-content:center;font:900 44px Poppins;color:#fff;opacity:0';d.textContent='▼';etf.appendChild(d)}
  $('w-title').textContent=T.wTitle; $('w-ppit').textContent=T.ppiT; $('w-ppiv').textContent=T.ppiV; $('w-ppis').textContent=T.ppiS; $('w-note').textContent=T.wNote;
  const wc=$('w-cards'); T.idx.forEach((r,i)=>{const d=document.createElement('div');d.className='card';d.style.cssText=`left:56px;top:${100+i*205}px;width:640px;height:185px;opacity:0`;
    d.innerHTML=`<div style="position:absolute;left:34px;top:28px;font:800 34px Poppins;color:var(--mut)">${r.n}</div><div style="position:absolute;left:34px;top:80px;font:900 78px/1 Poppins;color:${r.up?'var(--up)':'var(--down)'}">${r.up?'▲':'▼'} ${r.v}</div>`;wc.appendChild(d)});
  $('a-title').textContent=T.aTitle;
  const ar=$('a-rows'); T.asia.forEach((r,i)=>{const d=document.createElement('div');d.style.cssText=`position:absolute;left:56px;top:${110+i*215}px;width:968px;height:190px;opacity:0`;
    d.innerHTML=`<div style="font:800 34px Poppins;color:var(--mut);letter-spacing:.06em">${r.n}</div><div style="position:relative;margin-top:14px;height:88px;border-radius:22px;background:#17222a"><div class="bar" data-v="${r.p}" style="position:absolute;top:0;height:100%;border-radius:22px;width:0;background:${r.up?'linear-gradient(90deg,#1fa65e,var(--up))':'linear-gradient(90deg,#c9323a,var(--down))'}"></div><div class="num" style="position:absolute;right:26px;top:14px;font:900 56px Poppins;color:#fff">${r.v}</div></div>`;ar.appendChild(d)});
  $('o-title').textContent=T.oTitle; $('o-name').textContent=T.oName; $('o-val').textContent=T.oVal; $('o-chg').textContent=T.oChg; $('o-chip').textContent=T.oChip;
  $('f-title').textContent=T.fTitle; $('f-sub').textContent=T.fSub; $('f-l1').textContent=T.fL1; $('f-l2').textContent=T.fL2;
  $('u-t1').innerHTML=T.outT1; $('foot').textContent=T.foot; $('tz-tx').textContent=T.teaser;
  // falling candles
  const cd=$('h-candles'); let y=18; for(let i=0;i<13;i++){const h=34+((i*37)%40), w=32; const c=document.createElement('div');
    const dy=(i*17)%24; y=8+i*13+dy*0.25; c.style.cssText=`position:absolute;left:${i*42}px;top:${y}px;width:${w}px;height:${h}px;border-radius:6px;background:linear-gradient(#ff7a7e,#c9323a);opacity:0`;
    const wick=document.createElement('div');wick.style.cssText=`position:absolute;left:${w/2-2}px;top:-16px;width:4px;height:${h+32}px;background:#ff9a9d;opacity:.8;z-index:-1`;c.appendChild(wick);cd.appendChild(c)}
}
function fade(t,t0,t1,fi=.35,fo=.3){return cl((t-t0)/fi)*cl((t1+fo-t)/fo)}
function render(t){
  const C=CFG, S=C.scenes, T=C.T;
  $('prog').firstElementChild.style.width=(100*cl(t/C.total))+'%';
  for(const id of Object.keys(S)){
    const el=$('sc-'+id), [t0,t1]=S[id]; const vis=t>=t0-0.01&&t<=t1+0.3;
    el.style.display=vis?'block':'none'; if(!vis)continue;
    const lt=t-t0, a=(id==='hook'&&t<0.25)?1:fade(t,t0,t1,id==='hook'?0.01:0.35,0.3); el.style.opacity=a;
    if(t<t1+0.01){ setBG(BG[id][0],BG[id][1]) }
    U[id](lt,t1-t0,t);
  }
  // captions: word-by-word highlight
  let cap=null; for(const s of C.segs){ if(t>=s.t0-0.05&&t<=s.t1+0.12){cap=s;break} }
  const capEl=$('cap');
  if(!cap){ if(capEl.dataset.k!=='-'){capEl.innerHTML='';capEl.dataset.k='-'} }
  else{
    if(capEl.dataset.k!==cap.name){ capEl.dataset.k=cap.name; const parts=cap.cap.split(' '); capEl.innerHTML=parts.map(w=>`<span class="w">${w}</span>`).join('');
      const wts=parts.map(w=>w.length+2), tw=wts.reduce((a,b)=>a+b,0); let acc=0; capEl._cum=wts.map(w=>(acc+=w)/tw) }
    // highlight follows the real speech length (not the padded scene slot), weighted by word length
    const ws=capEl.children, p=cl((t-cap.t0)/(cap.sp||(cap.t1-cap.t0))), n=ws.length; let cur=n-1; for(let i=0;i<n;i++){ if(p<capEl._cum[i]){cur=i;break} }
    for(let i=0;i<n;i++){ws[i].className='w'+(i<cur?' on':(i===cur?' cur':''))}
  }
  // teaser (until the Fed reveal)
  const tz=$('teaser'); const on=t>=C.teaser[0]&&t<C.teaser[1]; tz.style.display=on?'flex':'none';
  if(on){ tz.style.opacity=cl((t-C.teaser[0])/.4)*cl((C.teaser[1]-t)/.3); const q=$('tz-q'); q.style.filter=`blur(${5+1.5*Math.sin(t*6)}px)`;
    tz.style.transform=`scale(${1+0.015*Math.sin(t*5)})` }
  $('foot').style.opacity=(t>=S.out[0]-0.2)?cl((t-S.out[0]+0.2)/.5):0;
  // flash on crash hit
  $('flash').style.opacity=t<0.35?0.55*(1-t/0.35):0;
}
const U={
 hook(lt,dur,t){
  const e=eob(lt/.5);
  $('h-pill').style.opacity=cl(lt/.25); $('h-dot').style.opacity=.55+.45*Math.sin(lt*9);
  $('h-btc').style.opacity=cl((lt-.15)/.2); $('h-btc').style.transform=`translateX(${(1-eo((lt-.15)/.4))*-120}px)`;
  const dn=eob((lt-.45)/.45); $('h-dn').style.opacity=cl((lt-.45)/.15); $('h-dn').style.transform=`scale(${0.6+0.4*dn}) translateX(${Math.sin(lt*40)*Math.max(0,1-(lt-.5)*2)*8}px)`; $('h-dn').style.transformOrigin='left center';
  $('h-price').style.opacity=cl((lt-.9)/.3); $('h-price').style.transform=`translateY(${(1-eo((lt-.9)/.4))*40}px)`;
  const bear=eo((lt-.2)/.7); $('h-bear').style.opacity=bear; $('h-bear').style.transform=`translateX(${(1-bear)*260}px) translateY(${Math.sin(lt*2.2)*10}px) rotate(${Math.sin(lt*3)*0.8}deg)`;
  const hookSplit=C_hook2start();
  const phase2=t>=hookSplit;
  $('h-c1').style.display=phase2?'none':'block'; $('h-c2').style.display=phase2?'none':'block'; $('h-q').style.display=phase2?'block':'none';
  $('h-c1').style.opacity=cl((lt-1.5)/.3); $('h-c1').style.transform=`translateX(${(1-eo((lt-1.5)/.4))*-80}px)`;
  const c2=cl((lt-2.1)/.3); $('h-c2').style.opacity=c2; $('h-c2').style.transform=`translateX(${(1-eo((lt-2.1)/.4))*-80}px)`;
  const liq=1400*eo((lt-2.1)/1.6); $('h-liq').textContent=CFG.lang==='es'?(Math.round(liq).toLocaleString('de-DE')+' M$'):('$'+(liq/1000).toFixed(1)+'B');
  if(phase2){const q=cl((t-hookSplit)/.35); $('h-q').style.opacity=q; $('h-q').style.transform=`translateY(${(1-eo(q))*30}px) scale(${1+0.02*Math.sin(t*7)})`}
  document.querySelectorAll('#h-candles > div').forEach((c,i)=>{const a=cl((lt-.6-i*.11)/.25); c.style.opacity=a; c.style.transform=`translateY(${(1-a)*-30}px)`});
 },
 intro(lt,dur){const e=eob(lt/.6); $('i-wallie').style.transform=`translateY(${(1-e)*140+Math.sin(lt*2.4)*14}px) scale(${.85+.15*e})`; $('i-wallie').style.opacity=cl(lt/.3);
